[workspace]
resolver = "2"
members = [
    "crates/fetcher",
    "crates/store",
    "crates/rules",
    "crates/ai-pipeline",
    "crates/search",
    "crates/embedding",
    "crates/api",
    "crates/worker-entry",
    "crates/vectorize",
    "crates/entity",
    "crates/intelligence/signal-engine",
    "crates/object-store",
    "crates/event-store",
    "crates/intelligence/reflection-engine",
    "crates/memory-engine",
    "crates/context-engine",
    "crates/agent-engine",
    "crates/shared-kernel",
    "crates/application",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared dependency versions across the workspace. Individual crates pull
# what they need via `workspace = true` so bumping a version happens once.
[workspace.dependencies]
worker = { version = "0.8", features = ["http", "d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
feed-rs = "2"
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["js"] }
scraper = "0.22"
js-sys = "0.3"
url = "2"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4"
futures = "0.3"
fastrand = "2"
serde-wasm-bindgen = "0.6"

fetcher = { path = "crates/fetcher" }
store = { path = "crates/store" }
rules = { path = "crates/rules" }
ai-pipeline = { path = "crates/ai-pipeline" }
embedding = { path = "crates/embedding" }
search = { path = "crates/search" }
api = { path = "crates/api" }
vectorize = { path = "crates/vectorize" }
entity = { path = "crates/entity" }
signal-engine = { path = "crates/intelligence/signal-engine" }
object-store = { path = "crates/object-store" }
event-store = { path = "crates/event-store" }
reflection-engine = { path = "crates/intelligence/reflection-engine" }
memory-engine = { path = "crates/memory-engine" }
context-engine = { path = "crates/context-engine" }
agent-engine = { path = "crates/agent-engine" }
shared-kernel = { path = "crates/shared-kernel" }
application = { path = "crates/application" }

[workspace.lints.rust]
unsafe_code = "deny"
unused_imports = "deny"

[workspace.lints.clippy]
option_map_or_none = "warn"
module_name_repetitions = "allow"
pub_use = "allow"
wildcard_imports = "allow"

[profile.release]
panic = "unwind"
lto = true
codegen-units = 1

