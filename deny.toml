[graph]
all-features = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
# 分层依赖封禁（decoupling P1）不在本表：cargo-deny bans 是全局作用域，
# 无法按"消费者 crate"限制。边缘级封禁由 scripts/check-layered-deps.sh 用
# cargo metadata 断言（受控 crate 禁止新增 store/vectorize/embedding/
# event-store/object-store，现状耦合在脚本 GRANDFATHERED 表豁免至 Sprint 5）。
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
