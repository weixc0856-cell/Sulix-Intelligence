name = "sulix-feed-worker"
main = "build/index.js"
compatibility_date = "2026-07-26"
compatibility_flags = ["nodejs_compat"]

# Wrangler is the single entry point for building the Worker bundle: both
# `wrangler dev` (local) and `wrangler deploy` (CI) run worker-build here.
# Toolchain installation (worker-build binary) is NOT this command's job — it
# is handled by rust-toolchain.toml + the CI dependency cache. Keep the
# worker-build version in sync with .github/workflows/deploy.yml.
[build]
command = "worker-build --release"

[vars]
AI_BASE_URL = "https://api.deepseek.com/v1"
AI_CHAT_MODEL = "deepseek-v4-flash"
AI_EMBEDDING_MODEL = "bge-large-en-v1.5"
CRON_INGESTION_ENABLED = "true"
CRON_SIGNAL_ENABLED = "true"
# CRON_REFLECTION_ENABLED and CRON_MEMORY_ENABLED phased in after signal stable

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "sulix-feed-db"
database_id = "42c2dc1c-d385-4f62-9bbf-d5bdb684cd28"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "RAW_CONTENT"
bucket_name = "sulix-feed-raw"

[[kv_namespaces]]
binding = "CACHE"
id = "50437e8c1f9b4cf4b8b26c16fda159d0"

[[queues.producers]]
binding = "FETCH_QUEUE"
queue = "sulix-feed-fetch-queue"

[[queues.consumers]]
queue = "sulix-feed-fetch-queue"
max_batch_size = 10
max_batch_timeout = 30
max_retries = 3
dead_letter_queue = "sulix-feed-fetch-dlq"

[[vectorize]]
binding = "VECTORIZE"
index_name = "sulix-article-embeddings"

[ai]
binding = "AI"
