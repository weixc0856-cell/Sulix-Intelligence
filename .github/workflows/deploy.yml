name: Deploy backend Worker

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned by rust-toolchain.toml — keep both in sync.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The deploy artifact runs on wasm32-unknown-unknown, so gate on that
      # target (not the native default). Full PR gates live in lint.yml.
      - name: WASM check (deployment gate)
        run: cargo check --workspace --all-features --target wasm32-unknown-unknown

      - name: Cache worker-build binary
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/bin/wasm-bindgen-cli
          key: worker-build-${{ runner.os }}

      # Pin an exact worker-build version (0.x ^ranges are not safe ranges) —
      # keep in sync with the version verified locally and with [build] in
      # crates/worker-entry/wrangler.toml.
      - name: Install worker-build
        run: which worker-build || cargo install worker-build@0.8.5

      # `wrangler deploy` runs the [build] command (worker-build --release),
      # the single build entry point shared with local `wrangler dev`.
      - name: Deploy to Cloudflare Workers
        working-directory: crates/worker-entry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest deploy

      - name: Smoke test — health
        run: |
          for i in $(seq 1 5); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://sulix-feed-worker.weixc0856.workers.dev/api/health" --connect-timeout 10)
            if [ "$STATUS" = "200" ]; then echo "✅ Health check OK (HTTP $STATUS)"; curl -s "https://sulix-feed-worker.weixc0856.workers.dev/api/health"; echo ""; exit 0; fi
            echo "  Attempt $i/5: HTTP $STATUS, waiting..."; sleep 5
          done
          echo "❌ Health check failed after 5 attempts"; exit 1

      - name: Smoke test — semantic search
        run: |
          RESP=$(curl -s -X POST "https://sulix-feed-worker.weixc0856.workers.dev/api/articles/search" \
            -H "Content-Type: application/json" \
            -d '{"q":"AI infrastructure","mode":"semantic","limit":1}')
          if echo "$RESP" | grep -q '"mode":"semantic"'; then
            echo "✅ Semantic search OK"
            echo "$RESP" | head -c 200
            echo ""
          else
            echo "❌ Semantic search failed: $RESP"; exit 1
          fi
