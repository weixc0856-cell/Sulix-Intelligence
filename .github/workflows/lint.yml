name: Lint

on:
  pull_request:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - 'deny.toml'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - 'rustfmt.toml'
      - 'scripts/check-layered-deps.sh'

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned by rust-toolchain.toml — keep both in sync.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Step 1: cargo-deny — 许可证合规 + 依赖重复检查
      # (advisories 检查因 fxhash unmaintained 暂不启用，见 deny.toml)
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check licenses and dependency graph
        run: cargo deny check bans licenses sources

      # Step 1.5: 分层依赖守卫 — 受控 crate 禁止新增对基础设施 crate 的依赖（decoupling P1）
      - name: Check layered dependencies
        run: bash scripts/check-layered-deps.sh

      # Step 2: cargo fmt — 格式统一
      - name: Format check
        run: cargo fmt --check

      # Step 3: clippy — 代码质量（遵守 workspace lints）
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Step 3.5: wasm 兼容检查 — 部署目标被编译为 wasm32-unknown-unknown，
      # 之前只能在 push 后 deploy 时暴露编译错误；现在 PR 合入前即可见。
      # 注意：故意不用 --all-targets。deploy 的 worker-build 只编译 lib/bin，
      # 不含测试目标；且信号引擎有 `#[cfg(all(test, target_arch = "wasm32"))]`
      # 的遗留测试模块（plain #[test] 在 wasm32 上既无法运行也不编译），
      # 检查 test 目标只会产生与部署无关的噪音。
      - name: Wasm check
        run: cargo check --workspace --all-features --target wasm32-unknown-unknown

      # Step 4: 单元测试
      # 覆盖率门禁在独立的 .github/workflows/coverage.yml（14-crate 集合，--fail-under-lines 70），
      # 见 docs/testing.md。此处只管测试全绿。
      # --no-fail-fast：跑完所有 crate 再失败，输出里每个 test binary 都以 crate 命名，
      # 失败时可定位到具体 crate。
      - name: Run tests
        run: cargo test --workspace --all-features --no-fail-fast

  # Step 5: 架构依赖护栏（decoupling P7）— cargo-metadata 断言 DDD 分层 + 无循环依赖。
  # 独立 job：测试里嵌套跑 `cargo metadata --no-deps`，与 lint job 的编译锁互不干扰。
  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain pinned by rust-toolchain.toml — keep both in sync.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.0"

      - uses: Swatinem/rust-cache@v2

      - name: Architecture dependency guard (P7)
        run: cargo test -p shared-kernel --test architecture
